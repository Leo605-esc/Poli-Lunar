<style>
:root{--ink:#f2f0ff;--soft:#b9b6e0;--gold:#ffcf8a;--card:rgba(12,12,40,.72);--line:rgba(255,255,255,.22);color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font:400 1rem/1.5 "Bricolage Grotesque",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{display:none}
button{font:inherit;cursor:pointer;color:inherit}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;font-size:12px;font-weight:600;color:#cfd0ee;text-shadow:0 0 4px #000;white-space:nowrap}
.lb.has{color:var(--gold)}
.lb.has::before{content:"● ";font-size:9px}
#splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.8));transition:opacity .8s}
#splash.off{opacity:0;pointer-events:none}
#ttl{font-size:clamp(2.6rem,12vw,6rem);font-weight:800;letter-spacing:.04em;margin:0 0 14px;animation:ti 1.6s ease-out both}
@keyframes ti{from{opacity:0;letter-spacing:.5em;transform:scale(.8)}to{opacity:1;letter-spacing:.04em;transform:none}}
#intro{max-width:30ch;font-size:1.15rem;color:var(--soft);margin:0 0 26px;animation:fi 1s 1.4s both}
#go{background:var(--gold);color:#1a1230;border:0;border-radius:999px;padding:12px 40px;font-weight:800;font-size:1.1rem;letter-spacing:.1em;animation:fi 1s 2.2s both}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#menuBtn{position:fixed;z-index:9;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 11px}
#menuBtn i{display:block;height:3px;background:var(--ink);border-radius:2px}
#menu{position:fixed;z-index:9;top:calc(66px + env(safe-area-inset-top,0px));right:14px;display:none;flex-direction:column;gap:6px;padding:8px;border-radius:12px;border:1px solid var(--line);background:rgba(10,10,34,.95)}
#menu.open{display:flex}
#menu button{background:none;border:0;padding:8px 18px;text-align:left;border-radius:8px}
#menu button.cur{background:var(--gold);color:#1a1230;font-weight:800}
#hint{position:fixed;z-index:3;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--soft);margin:0;display:none;padding:0 16px}
#lst{position:fixed;inset:0;z-index:4;display:none;overflow:auto;padding:calc(70px + env(safe-area-inset-top,0px)) 18px 40px}
#lst.on{display:block}
#lst .in{max-width:860px;margin:0 auto}
#back{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;margin-bottom:14px}
#lt{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:800;margin:0;text-shadow:0 2px 10px #000}
#ls{margin:4px 0 16px;text-shadow:0 1px 6px #000}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cd{background:var(--card);backdrop-filter:blur(6px);border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-height:84px}
.cd:hover,.cd:focus-visible{border-color:var(--gold);outline:none}
.cd b{display:block;font-weight:800;line-height:1.2}
.cd small{color:var(--soft)}
#rb{position:fixed;z-index:6;left:0;right:0;bottom:0;display:none;align-items:flex-end;gap:10px;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
#rb.on{display:flex}
#rob{flex:none;width:92px;height:auto}
#bub{flex:1;background:rgba(12,12,40,.9);border:2px solid var(--gold);border-radius:18px 18px 18px 4px;padding:14px 16px;min-height:96px}
#bt{margin:0 0 10px;font-size:1.05rem;min-height:3.2em}
#cont{display:none;background:var(--gold);color:#1a1230;border:0;border-radius:999px;padding:8px 24px;font-weight:800}
#mouth{transform-box:fill-box;transform-origin:center}
.talk #mouth{animation:mo .22s infinite alternate}
@keyframes mo{to{transform:scaleY(3.2)}}
#ant{animation:bl 1.2s infinite alternate}
@keyframes bl{to{opacity:.3}}
#sel{max-width:32ch;color:var(--gold);margin:22px 0 0;animation:fi 1s 3s both}
#toast{position:fixed;z-index:7;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(90vw,360px);text-align:center;background:rgba(12,12,40,.95);border:2px solid var(--gold);border-radius:14px;padding:12px 18px;display:none}
#toast.on{display:block}
.hand{position:fixed;z-index:10;display:none;align-items:center;gap:8px;pointer-events:none}
.hand.on{display:flex}
.hand svg{width:44px;height:58px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(10px)}}
#hand1{top:calc(64px + env(safe-area-inset-top,0px));right:12px;flex-direction:row-reverse}
#h1t{background:rgba(12,12,40,.95);border:2px solid var(--gold);border-radius:12px;padding:6px 12px;font-weight:600}
#skipbox{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top,0px));left:14px;display:none;flex-direction:column;align-items:flex-start;gap:4px}
#skipbox.on{display:flex}
#skip{background:var(--card);border:2px solid var(--gold);border-radius:999px;padding:10px 16px;font-weight:600}
#skipbox svg{width:44px;height:58px;margin-left:30px;animation:bob 1s infinite}
#tut{position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;background:rgba(3,3,18,.8);padding:20px}
#tut.on{display:flex}
#tut .in{max-width:420px;background:#14143a;border:2px solid var(--gold);border-radius:18px;padding:22px;text-align:center}
#tut h2{margin:4px 0}
#tut p{font-size:1.1rem}
#tn{background:var(--gold);color:#1a1230;border:0;border-radius:999px;padding:8px 24px;font-weight:800;margin:6px}
#tx{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 20px;margin:6px}
#pic svg{width:130px;height:86px;display:block;margin-bottom:8px;background:rgba(255,255,255,.07);border-radius:10px;animation:fi .6s both}
#menu .sep{height:1px;background:var(--line);margin:2px 0}
#info{position:fixed;inset:0;z-index:8;display:none;overflow:auto;background:rgba(3,3,18,.95);padding:calc(70px + env(safe-area-inset-top,0px)) 18px 40px}
#info.on{display:block}
#info .in{max-width:760px;margin:0 auto}
#close{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;margin-bottom:14px}
#it{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;margin:0 0 14px}
#icards{display:grid;gap:12px}
.ic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ic b{color:var(--gold);font-size:1.15rem}
.ic span{font-size:1.7rem}
.ic p{margin:4px 0 0}
.ic a{color:var(--gold);word-break:break-all}
#pic{display:none}
#pimg{position:fixed;inset:0;z-index:5;display:none;background-size:cover;background-position:center}
#pimg.on{display:block}
#pimg{background-color:rgba(0,0,0,.45);overflow:hidden}
#pimg .st{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 50% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 80%,#fff,transparent);animation:tw 2.5s infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
#pimg .ob{position:absolute;left:50%;top:26%;width:min(70vw,380px);transform:translate(-50%,-50%);animation:fl 4s ease-in-out infinite}
#pimg .ob svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 18px rgba(255,207,138,.45))}
@keyframes fl{0%,100%{transform:translate(-50%,-50%) rotate(-4deg)}50%{transform:translate(-50%,-58%) rotate(4deg)}}
#pimg .ob.fall{animation:fa 5s ease-in infinite}
@keyframes fa{0%{transform:translate(-50%,-90%) rotate(-6deg);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-10%) rotate(4deg)}}
#qz{position:fixed;inset:0;z-index:8;display:none;overflow:auto;background:rgba(3,3,18,.95);padding:calc(70px + env(safe-area-inset-top,0px)) 18px 40px}
#qz.on{display:block}
#qz .in{max-width:640px;margin:0 auto}
#qx{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;margin-bottom:14px}
#qt{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;margin:0 0 8px}
#qp{font-size:1.1rem}
#qa{display:grid;gap:10px;margin:12px 0}
.op{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.op.ok{border-color:#5be38a;background:rgba(91,227,138,.15)}
.op.no{border-color:#ff6a6a;background:rgba(255,106,106,.15)}
#qn{display:none;background:var(--gold);color:#1a1230;border:0;border-radius:999px;padding:8px 24px;font-weight:800}
#snd{background:none;border:0;font-size:1.3rem;margin-left:12px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){#ttl,#intro,#go{animation:none}.talk #mouth{animation:none}}
</style>
</head>

<script>
var $=function(i){return document.getElementById(i)},L="es",st="splash";
var T={es:{intro:"Es una app para ver los objetos que ha perdido la NASA en el espacio.",go:"INICIO",hint:"Toca un planeta para enviar un cohete.",back:"← Sistema solar",cont:"Continuar",lt:"Objetos perdidos en ",ls:"Toca uno para que Poli te lo explique.",en:"Lanzado en ",mf:'¿Sabías qué?',mn:'¿Qué significan los nombres?',cl:'Cerrar',sel:'Selecciona el planeta para ver los objetos perdidos en el espacio por la NASA.',no:'En este planeta la NASA no ha perdido ningún objeto.',tu:'Tutorial',sk:'Saltar tutorial',h1:'Ver tutorial',nx:'Siguiente',ok:'Listo',qz:'Quiz',pq:'Pregunta',sc:'Sacaste',de:'de',rt:'Intentar de nuevo',fu:'Fuentes de información',fn:'Estos son sitios oficiales de la NASA para confirmar cada dato de la app.'},
en:{intro:"It’s an app to see the objects NASA has lost in space.",go:"START",hint:"Tap a planet to send a rocket.",back:"← Solar system",cont:"Continue",lt:"Lost objects on ",ls:"Tap one and Poli will explain it.",en:"Launched in ",mf:'Did you know?',mn:'What the names mean',cl:'Close',sel:'Select a planet to see the objects NASA has lost in space.',no:'On this planet NASA has not lost any object.',tu:'Tutorial',sk:'Skip tutorial',h1:'See tutorial',nx:'Next',ok:'Done',qz:'Quiz',pq:'Question',sc:'You got',de:'out of',rt:'Try again',fu:'Sources',fn:'These are official NASA sites to confirm each fact in the app.'}};
var S={cc:["Cabo Cañaveral, Florida","Cape Canaveral, Florida"],ksc:["Centro Espacial Kennedy, Florida","Kennedy Space Center, Florida"],van:["Base Vandenberg, California","Vandenberg Base, California"]};
var O={
venus:[["Mariner 1",1962,203,"cc",["Ser la primera sonda de EE. UU. en pasar cerca de Venus.","To be the first US probe to fly by Venus."],["Se perdió porque el cohete se desvió de su rumbo por dos problemas combinados: una antena del cohete perdió la señal y falló una parte del guiado. Lo destruyeron unos 5 minutos después del despegue.","It was lost because the rocket veered off course from two combined problems: a rocket antenna lost its signal and part of the guidance failed. It was destroyed about 5 minutes after liftoff."],['36 días después la NASA lanzó Mariner 2, que fue la primera nave en pasar con éxito cerca de otro planeta.','NASA launched Mariner 2 just 36 days later, and it became the first spacecraft to fly past another planet successfully.']]],
tierra:[["Hubble",1990,11000,"ksc",["Observar el universo sin la distorsión de la atmósfera.","Observe the universe without atmospheric distortion."],["Se dañó porque su espejo estaba mal pulido y veía borroso. En 1993 le pusieron unas “gafas” (COSTAR).","It was damaged because its mirror was ground wrong, so images were blurry. In 1993 it got “glasses” (COSTAR)."],['Sigue trabajando más de 30 años después y ha tenido cinco misiones de reparación con astronautas.','It is still working more than 30 years later and has had five repair missions with astronauts.']],
["Orbiting Carbon Observatory",2009,447,"van",["Medir el CO₂ del aire.","Measure carbon dioxide in the air."],["Se perdió porque la cubierta del cohete no se separó y el satélite cayó al mar cerca de la Antártida.","It was lost because the rocket fairing never separated and the satellite fell into the sea near Antarctica."],['La NASA lanzó una copia, el OCO-2, en 2014, y esa sí llegó a su órbita.','NASA launched a copy, OCO-2, in 2014, and it did reach orbit.']],
["Glory",2011,545,"van",["Estudiar partículas del aire y el clima.","Study airborne particles and climate."],["Se perdió porque falló igual que el OCO: la cubierta no se soltó y cayó al Pacífico.","It was lost because it had the same failure as OCO: the fairing stuck and it fell into the Pacific."],['Fue la segunda vez que el cohete Taurus falló con su cubierta, después del OCO.','It was the second time the Taurus rocket failed with its fairing, after OCO.']],
["Genesis",2001,636,"cc",["Traer a la Tierra partículas del viento solar.","Bring solar wind particles back to Earth."],["Se estrelló en Utah porque sus paracaídas no abrieron, ya que sus sensores estaban instalados al revés.","It crashed in Utah because its parachutes failed, since its sensors were installed backwards."],['Aun así los científicos lograron rescatar parte de las muestras del viento solar.','Even so, scientists managed to recover some of the solar wind samples.']]],
luna:[["Ranger 3",1962,330,"cc",["Tomar fotos de cerca de la Luna.","Take close-up photos of the Moon."],["Se perdió porque salió demasiado rápido, pasó a 36,800 km de la Luna y quedó orbitando el Sol.","It was lost because it launched too fast, missed the Moon by 36,800 km and ended up orbiting the Sun."],['No fue hasta Ranger 7, en 1964, cuando llegaron buenas fotos de la Luna.','Good Moon photos only arrived with Ranger 7, in 1964.']],
["Ranger 4",1962,331,"cc",["Fotografiar la Luna y llevar un sismómetro.","Photograph the Moon and carry a seismometer."],["Se perdió porque su computadora falló y chocó contra el lado oculto sin enviar datos.","It was lost because its computer failed and it hit the far side without sending data."],['Fue la primera nave de EE. UU. en llegar a la Luna, aunque chocó sin mandar datos.','It was the first US spacecraft to reach the Moon, though it crashed without sending data.']],
["Ranger 6",1964,367,"cc",["Tomar miles de fotos antes de chocar con la Luna.","Take thousands of photos before crashing into the Moon."],["Se perdió porque, aunque llegó al Mar de la Tranquilidad, sus cámaras nunca se encendieron.","It was lost because, although it reached the Sea of Tranquility, its cameras never turned on."],['Los ingenieros corrigieron el diseño y Ranger 7 sí tomó más de 4,000 fotos.','Engineers fixed the design and Ranger 7 took more than 4,000 photos.']],
["Apollo 13 (Aquarius)",1970,15000,"ksc",["Llevar a tres astronautas a la Luna.","Carry three astronauts to the Moon."],["Se abortó la misión porque explotó un tanque de oxígeno. Aquarius fue su bote salvavidas y se quemó al volver; todos regresaron sanos.","The mission was aborted because an oxygen tank exploded. Aquarius became a lifeboat and burned up on return; everyone came home safe."],['Los astronautas eran Lovell, Swigert y Haise. Cayeron al océano Pacífico el 17 de abril de 1970.','The astronauts were Lovell, Swigert and Haise. They splashed down in the Pacific Ocean on April 17, 1970.']]],
marte:[["Mars Climate Orbiter",1998,638,"cc",["Estudiar el clima de Marte.","Study Martian weather."],["Se perdió porque un equipo usó libras-fuerza y otro newtons, y entró muy bajo en Marte.","It was lost because one team used pound-force and another newtons, so it entered Mars too low."],['Este error de unidades costó unos 125 millones de dólares.','This unit mix-up cost about 125 million dollars.']],
["Mars Polar Lander",1999,583,"cc",["Buscar agua y hielo en el polo sur de Marte.","Look for water and ice near Mars’s south pole."],["Se perdió porque dejó de comunicarse al aterrizar; probablemente sus motores se apagaron antes de tiempo.","It was lost because it went silent while landing; its engines likely shut off too early."],['Llevaba dos mini sondas, llamadas Deep Space 2, que también se perdieron.','It carried two mini probes, called Deep Space 2, which were also lost.']],
["Rover Spirit",2003,185,"cc",["Buscar huellas de agua en rocas de Marte.","Look for signs of water in Martian rocks."],["Se perdió porque se atascó en arena suave en 2009 y no pudo apuntar sus paneles al Sol.","It was lost because it got stuck in soft sand in 2009 and couldn’t aim its solar panels at the Sun."],['Estaba hecho para durar 90 días y trabajó cerca de seis años.','It was built to last 90 days and worked for about six years.']],
["Mars Observer",1992,2570,"cc",["Estudiar la geología y el clima de Marte.","Study Mars’s geology and climate."],["Se perdió porque dejó de comunicarse tres días antes de llegar; quizá se rompió una línea de combustible.","It was lost because it went silent three days before arriving; a fuel line probably broke."],['Fue la primera misión de la NASA a Marte en 17 años, desde las Viking.','It was NASA’s first Mars mission in 17 years, since the Vikings.']]],
jupiter:[["Galileo",1989,2562,"ksc",["Estudiar Júpiter y sus lunas.","Study Jupiter and its moons."],["Se dañó porque su antena principal no se abrió por completo en 1991, así que usó antenas pequeñas y compresión de datos. En 2003 se hundió en Júpiter a propósito.","It was damaged because its main antenna did not fully open in 1991, so it used small antennas and data compression. In 2003 it was sent into Jupiter on purpose."],['Fue la primera nave en orbitar Júpiter y soltó una sonda que bajó a su atmósfera en 1995.','It was the first spacecraft to orbit Jupiter and released a probe that dropped into its atmosphere in 1995.']]]};
